<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRDT Shopping Cart Visualizer</title>
  <meta name="description" content="Distributed Shopping Cart with CRDT — Version-Based Conflict Resolution Demo" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden relative font-sans">

  <!-- Background Shapes -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Header -->
  <header class="text-center py-8 px-4 bg-slate-950/60 backdrop-blur-xl border-b border-white/10 mb-8">
    <h1 class="text-4xl font-bold mb-2 gradient-text inline-flex items-center gap-3">
      <i class="fa-solid fa-cart-shopping"></i> CRDT Shopping Cart
    </h1>
    <p class="text-slate-400 mb-5">Distributed Systems: Conflict-free Replicated Data Type</p>

    <!-- Controls -->
    <div class="flex justify-center gap-3 items-center flex-wrap">
      <button id="btn-sync-all"
        class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold transition-all duration-200 flex items-center gap-2 hover:-translate-y-0.5">
        <i class="fa-solid fa-rotate"></i> Global Sync
      </button>
    </div>
  </header>

  <!-- Dashboard -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 px-6 pb-8 max-w-screen-2xl mx-auto" id="dashboard">

    <!-- Node A — Phone -->
    <div
      class="bg-slate-800/70 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden shadow-xl flex flex-col h-[750px] transition-all duration-300"
      id="card-node-A" data-node="A" data-port="5001">
      <div class="px-4 py-3 bg-white/[0.03] border-b border-white/10 flex flex-col gap-2 flex-shrink-0">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-semibold flex items-center gap-2">
            <i class="fa-solid fa-mobile-screen"></i> Phone
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300">5001</span>
          </h2>
          <div class="status-indicator flex items-center gap-2">
            <div class="dot w-2.5 h-2.5 rounded-full bg-emerald-500 dot-glow"></div>
            <span class="status-text text-sm">Online</span>
          </div>
        </div>
        <div class="node-meta-row flex flex-wrap gap-2 items-center"></div>
      </div>
      <div class="p-5 flex-1 flex flex-col overflow-hidden">
        <div class="add-item-form flex gap-2 mb-4 flex-shrink-0">
          <input type="text"
            class="input-item flex-1 bg-slate-900/80 border border-white/10 text-slate-100 px-3 py-2 rounded-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all text-sm"
            placeholder="Nhập tên sản phẩm..." />
          <button
            class="btn-add bg-white/10 hover:bg-blue-500 text-white px-3 py-2 rounded-lg font-semibold transition-all duration-200">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div class="cart-items flex flex-col gap-3 flex-1 overflow-y-auto pr-1 mb-3 scrollbar-slim"></div>
        <div class="raw-data-toggle flex-shrink-0 pt-3 border-t border-white/5 flex justify-center gap-2">
          <button onclick="clearHistory('A',5001)"
            class="btn-clear-history text-amber-400 border border-amber-400/40 hover:bg-amber-400/10 text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-broom"></i> Clean Tombstones
          </button>
          <button
            class="btn-raw text-slate-400 border border-white/10 hover:bg-white/5 hover:text-white text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-code"></i> Raw Data
          </button>
        </div>
        <pre
          class="raw-data-view hidden mt-3 bg-black/50 p-4 rounded-lg text-xs overflow-x-auto text-violet-400 font-mono"></pre>
      </div>
    </div>

    <!-- Node B — Laptop -->
    <div
      class="bg-slate-800/70 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden shadow-xl flex flex-col h-[750px] transition-all duration-300"
      id="card-node-B" data-node="B" data-port="5002">
      <div class="px-4 py-3 bg-white/[0.03] border-b border-white/10 flex flex-col gap-2 flex-shrink-0">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-semibold flex items-center gap-2">
            <i class="fa-solid fa-laptop"></i> Laptop
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300">5002</span>
          </h2>
          <div class="status-indicator flex items-center gap-2">
            <div class="dot w-2.5 h-2.5 rounded-full bg-emerald-500 dot-glow"></div>
            <span class="status-text text-sm">Online</span>
          </div>
        </div>
        <div class="node-meta-row flex flex-wrap gap-2 items-center"></div>
      </div>
      <div class="p-5 flex-1 flex flex-col overflow-hidden">
        <div class="add-item-form flex gap-2 mb-4 flex-shrink-0">
          <input type="text"
            class="input-item flex-1 bg-slate-900/80 border border-white/10 text-slate-100 px-3 py-2 rounded-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all text-sm"
            placeholder="Nhập tên sản phẩm..." />
          <button
            class="btn-add bg-white/10 hover:bg-blue-500 text-white px-3 py-2 rounded-lg font-semibold transition-all duration-200">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div class="cart-items flex flex-col gap-3 flex-1 overflow-y-auto pr-1 mb-3 scrollbar-slim"></div>
        <div class="raw-data-toggle flex-shrink-0 pt-3 border-t border-white/5 flex justify-center gap-2">
          <button onclick="clearHistory('B',5002)"
            class="btn-clear-history text-amber-400 border border-amber-400/40 hover:bg-amber-400/10 text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-broom"></i> Clean Tombstones
          </button>
          <button
            class="btn-raw text-slate-400 border border-white/10 hover:bg-white/5 hover:text-white text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-code"></i> Raw Data
          </button>
        </div>
        <pre
          class="raw-data-view hidden mt-3 bg-black/50 p-4 rounded-lg text-xs overflow-x-auto text-violet-400 font-mono"></pre>
      </div>
    </div>

  </main>



  <script type="module" src="app-main.js"></script>
</body>

</html>
